<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EnglishEasy</title>
  <meta name="description" content="Личная игра для изучения английского до B2: сериалы, разговоры, карточки, боссы.">
  <meta name="theme-color" content="#0f0f17" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EnglishEasy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active"><span>🔥</span>Сегодня</button>
    <button data-tab="words"><span>🃏</span>Слова</button>
    <button data-tab="series"><span>🍿</span>Сериалы</button>
    <button data-tab="bosses"><span>⚔️</span>Боссы</button>
    <button data-tab="progress"><span>📈</span>Прогресс</button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
