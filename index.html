<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EnglishEasy</title>
  <meta name="description" content="Личная программа изучения английского до B2: слова, грамматика, слух, чтение, сериалы и разговоры.">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EnglishEasy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>Сегодня</button>
    <button data-tab="words">
      <svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="15" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v13"/></svg>Слова</button>
    <button data-tab="lessons">
      <svg viewBox="0 0 24 24"><path d="M5 4.5h10.5L19 8v11.5H5z"/><path d="M8.5 11h7M8.5 14.5h7M8.5 7.5h4"/></svg>Уроки</button>
    <button data-tab="listen">
      <svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>Слух</button>
    <button data-tab="bosses">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.3-3 7.7-7 9.5-4-1.8-7-5.2-7-9.5V6z"/></svg>Боссы</button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Прогресс</button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="data.js"></script>
  <script src="words.js"></script>
  <script src="plan.js"></script>
  <script src="grammar.js"></script>
  <script src="grammar-extra.js"></script>
  <script src="reading.js"></script>
  <script src="app.js"></script>
</body>
</html>
